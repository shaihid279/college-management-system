spring.application.name=college-management
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:college_db}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:college_user}
spring.datasource.password=${DB_PASSWORD:College@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

app.base-url=${BASE_URL:http://localhost:8080}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-demo=${SEED_DEMO:true}

app.placement.source-url=${PLACEMENT_URL:https://enggnagar.com}
app.placement.sync-enabled=${PLACEMENT_SYNC:true}