<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oops | CampusCore</title>
    <script>(function () { try { document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light'); } catch (e) {} })();</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center text-center p-3">
<div>
    <div class="display-1 fw-bold text-primary" th:text="${status}">404</div>
    <h1 class="h3" th:text="${status == 404 ? 'Page nahi mila' : (status == 403 ? 'Aapko is page ki permission nahi hai' : 'Kuch gadbad ho gayi')}">Error</h1>
    <p class="text-muted">Link check karein ya home page par wapas jayein.</p>
    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house me-1"></i>Home</a>
    <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Dashboard</a>
</div>
</body>
</html>
