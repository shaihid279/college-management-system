<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Forgot Password', ~{::main})}">
<body>
<main class="container">
    <div class="auth-wrap">
        <div class="card w-100" style="max-width: 440px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 mb-2">forget Password ?</h1>
                <p class="text-muted small">Enter your username or email. A reset link will be sent to you (valid for 30 minutes).</p>
                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="identifier">Username or Email</label>
                        <input class="form-control form-control-lg" id="identifier" name="identifier" required autofocus>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">send Reset link </button>
                </form>
                <div class="text-center mt-3"><a th:href="@{/login}" class="small">&larr; back to Login</a></div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
