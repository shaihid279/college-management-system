<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Change Password', ~{::main})}">
<body>
<main class="container">
    <div class="auth-wrap">
        <div class="card w-100" style="max-width: 460px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 mb-3"><i class="bi bi-key me-2"></i>Change Password</h1>
                <form th:action="@{/change-password}" method="post">
                    <div class="mb-3"><label class="form-label">Old password</label>
                        <input class="form-control" type="password" name="current" required autocomplete="current-password"></div>
                    <div class="mb-3"><label class="form-label">New password (min 8 character)</label>
                        <input class="form-control" type="password" name="password" minlength="8" required autocomplete="new-password"></div>
                    <div class="mb-3"><label class="form-label">New password again</label>
                        <input class="form-control" type="password" name="confirm" minlength="8" required autocomplete="new-password"></div>
                    <button class="btn btn-primary w-100" type="submit">Update password</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
