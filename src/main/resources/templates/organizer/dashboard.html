<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('My Events', ~{::main})}">
<body>
<main class="container">
    <h1 class="h3 mb-3">Event Manager</h1>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card"><div class="card-body p-4">
                <h5 class="mb-3" th:text="${form.id == null} ? 'New event' : 'Edit event'">New event</h5>
                <form th:action="@{/organizer/events}" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="id" th:if="${form.id != null}" th:value="${form.id}">
                    <div class="text-center mb-3">
                        <img id="bannerPreview" class="img-fluid rounded-3" style="max-height: 150px; width: 100%; object-fit: cover" alt="Banner"
                             th:src="${form.banner != null} ? @{'/uploads/' + ${form.banner}} : @{/images/logo.svg}">
                        <input class="form-control form-control-sm mt-2" type="file" name="banner" accept="image/png,image/jpeg,image/webp" data-preview="#bannerPreview">
                        <div class="form-text">Event banner (JPG/PNG/WEBP, max 2 MB)</div>
                    </div>
                    <div class="mb-2"><label class="form-label">Title</label>
                        <input class="form-control" name="title" th:value="${form.title}" maxlength="190" required></div>
                    <div class="mb-2"><label class="form-label">Date &amp; time</label>
                        <input class="form-control" type="datetime-local" name="when" th:value="${formDateTime}" required></div>
                    <div class="mb-2"><label class="form-label">Venue</label>
                        <input class="form-control" name="venue" th:value="${form.venue}" maxlength="190"></div>
                    <div class="mb-3"><label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="4" maxlength="2900" th:text="${form.description}"></textarea></div>

                    <div class="mb-3">
                        <label class="form-label">For which department?</label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="allDepartments" value="true" id="eAll"
                                   th:checked="${form.forAll}" data-dept-all="#eBranches">
                            <label class="form-check-label fw-semibold" for="eAll">All departments (All)</label>
                        </div>
                        <div id="eBranches" class="row g-1">
                            <div class="col-12" th:each="b, i : ${branches}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="branches" th:value="${b}" th:id="'eb' + ${i.index}"
                                           th:checked="${!form.forAll and ('|' + form.targetBranches + '|').contains('|' + b + '|')}">
                                    <label class="form-check-label" th:for="'eb' + ${i.index}" th:text="${b}">Branch</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-text">This event will only be visible to students and teachers from selected departments.
                            .</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1" type="submit" th:text="${form.id == null} ? 'Event add karein' : 'Update karein'">Save</button>
                        <a th:if="${form.id != null}" class="btn btn-outline-secondary" th:href="@{/organizer/dashboard}">Cancel</a>
                    </div>
                </form>
            </div></div>
        </div>
        <div class="col-lg-7">
            <h5 class="mb-3">My events</h5>
            <div class="card" th:if="${#lists.isEmpty(events)}"><div class="card-body coming-soon">
                <i class="bi bi-calendar-plus"></i><h6 class="mt-2">There are no events yet. Add your first event.</h6></div></div>
            <div class="card mb-3" th:each="e : ${events}"><div class="card-body">
                <div class="d-flex gap-3">
                    <div class="date-badge" th:style="${e.eventDateTime.isBefore(now)} ? 'background:#6c757d'">
                        <div class="d" th:text="${#temporals.format(e.eventDateTime, 'dd')}">01</div>
                        <div class="m" th:text="${#temporals.format(e.eventDateTime, 'MMM')}">Jan</div>
                    </div>
                    <div class="flex-grow-1">
                        <h6 class="mb-1" th:text="${e.title}">Title</h6>
                        <div class="small text-muted"><span th:text="${#temporals.format(e.eventDateTime, 'hh:mm a')}"></span>
                            <span th:if="${e.venue != null and !e.venue.isBlank()}" th:text="' | ' + ${e.venue}"></span></div>
                        <div class="mt-1">
                            <span class="badge text-bg-success" th:if="${e.forAll}">All Departments</span>
                            <span class="badge text-bg-info me-1" th:each="t : ${e.targetList}" th:text="${t}">Dept</span>
                        </div>
                        <span class="badge text-bg-light border mt-1"><i class="bi bi-people me-1"></i><span th:text="${counts[e.id]}">0</span> registered</span>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/organizer/events/{id}/registrations(id=${e.id})}"><i class="bi bi-list-ul me-1"></i>Registrations</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/organizer/dashboard(edit=${e.id})}"><i class="bi bi-pencil me-1"></i>Edit</a>
                    <form th:action="@{/organizer/events/{id}/delete(id=${e.id})}" method="post" data-confirm="The event and its registrations will be deleted. Are you sure?
">
                        <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash me-1"></i>Delete</button></form>
                </div>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
