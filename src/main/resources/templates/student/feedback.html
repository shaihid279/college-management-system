<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Feedback / Grievance', ~{::main})}">
<body>
<main class="container">
    <h1 class="h3 mb-3">Feedback / Grievance</h1>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card"><div class="card-body p-4">
                <h5 class="mb-3">Naya message</h5>
                <form th:action="@{/student/feedback}" method="post">
                    <div class="mb-3"><label class="form-label">Type</label>
                        <select class="form-select" name="type">
                            <option value="FEEDBACK">Suggestion / Feedback</option>
                            <option value="GRIEVANCE">Shikayat (Grievance)</option>
                        </select></div>
                    <div class="mb-3"><label class="form-label">Subject</label>
                        <input class="form-control" name="subject" maxlength="190" required></div>
                    <div class="mb-3"><label class="form-label">Message</label>
                        <textarea class="form-control" name="message" rows="5" minlength="10" maxlength="1900" required></textarea></div>
                    <button class="btn btn-primary w-100" type="submit"><i class="bi bi-send me-1"></i>Submit</button>
                </form>
            </div></div>
        </div>
        <div class="col-lg-7">
            <h5 class="mb-3">Mere messages</h5>
            <div th:if="${#lists.isEmpty(items)}" class="text-muted">Abhi tak aapne koi message nahi bheja.</div>
            <div class="card mb-3" th:each="f : ${items}"><div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <span class="badge me-1" th:classappend="${f.feedbackType == 'GRIEVANCE'} ? 'text-bg-warning' : 'text-bg-info'" th:text="${f.feedbackType}">TYPE</span>
                        <strong th:text="${f.subject}">Subject</strong>
                    </div>
                    <span class="badge" th:classappend="${f.status == 'RESOLVED'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${f.status}">OPEN</span>
                </div>
                <div class="small text-muted mb-2" th:text="${#temporals.format(f.createdAt, 'dd MMM yyyy, hh:mm a')}"></div>
                <div style="white-space: pre-line" th:text="${f.message}"></div>
                <div class="mt-2 p-2 rounded bg-body-tertiary" th:if="${f.reply != null}">
                    <div class="small fw-semibold text-primary"><i class="bi bi-reply-fill me-1"></i>Admin reply</div>
                    <div th:text="${f.reply}"></div>
                </div>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
