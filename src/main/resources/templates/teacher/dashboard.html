<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Teacher Dashboard', ~{::main})}">
<body>
<main class="container">
    <h1 class="h3 mb-3">Namaste, <span th:text="${me.fullName}">Teacher</span> 👋</h1>
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4"><div class="card"><div class="card-body d-flex gap-3 align-items-center">
            <div class="stat-icon bg-grad-1"><i class="bi bi-people"></i></div>
            <div><div class="small text-muted">Total Students</div><div class="h4 mb-0" th:text="${total}">0</div></div></div></div></div>
        <div class="col-6 col-md-4"><a class="text-decoration-none" th:href="@{/teacher/students}"><div class="card card-hover"><div class="card-body d-flex gap-3 align-items-center">
            <div class="stat-icon bg-grad-3"><i class="bi bi-exclamation-triangle"></i></div>
            <div><div class="small text-muted">Low Attendance (&lt;75%)</div><div class="h4 mb-0" th:text="${lowAttendance}">0</div></div></div></div></a></div>
        <div class="col-6 col-md-4"><a class="text-decoration-none" th:href="@{/teacher/students(pendingOnly=true)}"><div class="card card-hover"><div class="card-body d-flex gap-3 align-items-center">
            <div class="stat-icon bg-grad-2"><i class="bi bi-cash-coin"></i></div>
            <div><div class="small text-muted">Pending Fees</div><div class="h4 mb-0" th:text="${pendingCount}">0</div></div></div></div></a></div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6"><div class="card h-100"><div class="card-body">
            <h5 class="mb-3"><i class="bi bi-search me-2"></i>Student dhundein</h5>
            <form th:action="@{/teacher/students}" method="get" class="row g-2">
                <div class="col-12"><input class="form-control form-control-lg" name="q" placeholder="ID card number ya naam"></div>
                <div class="col-8"><select class="form-select" name="branch">
                    <option value="">Sab branches</option>
                    <option th:each="b : ${branches}" th:value="${b}" th:text="${b}"></option></select></div>
                <div class="col-4"><button class="btn btn-primary w-100" type="submit">Search</button></div>
            </form>
        </div></div></div>
        <div class="col-lg-6"><div class="card h-100"><div class="card-body">
            <div class="d-flex justify-content-between"><h5 class="mb-3">Meri recent activity</h5><a th:href="@{/teacher/audit}" class="small">Sab dekhein</a></div>
            <div class="text-muted" th:if="${#lists.isEmpty(recent)}">Abhi koi activity nahi.</div>
            <div class="list-row" th:each="l : ${recent}">
                <span class="badge text-bg-secondary" th:text="${l.action}">ACTION</span>
                <div class="flex-grow-1 small"><span th:text="${l.targetIdCard}"></span> <span class="text-muted" th:text="${l.details}"></span></div>
                <span class="small text-muted text-nowrap" th:text="${#temporals.format(l.createdAt, 'dd MMM, hh:mm a')}"></span>
            </div>
        </div></div></div>
    </div>
</main>
</body>
</html>
