<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Student Details', ~{::main})}">
<body>
<main class="container">
    <a th:href="@{/teacher/students}" class="small">&larr; Students list</a>
    <div class="card my-3"><div class="card-body d-flex flex-wrap gap-3 align-items-center">
        <th:block th:replace="~{fragments/layout :: avatar(${s.user}, 80)}"></th:block>
        <div class="flex-grow-1">
            <h2 class="h4 mb-1" th:text="${s.user.fullName}">Name</h2>
            <span class="badge text-bg-primary me-1" th:text="${s.idCardNo}">ID</span>
            <span class="badge text-bg-secondary me-1" th:text="${s.branch}">Branch</span>
            <span class="badge text-bg-info" th:text="'Year ' + ${s.year}">Year</span>
            <div class="small text-muted mt-1">
                <i class="bi bi-envelope me-1"></i><span th:text="${s.user.email != null} ? ${s.user.email} : '-'"></span>
                <i class="bi bi-telephone ms-3 me-1"></i><span th:text="${s.user.phone != null} ? ${s.user.phone} : '-'"></span>
            </div>
        </div>
    </div></div>

    <div class="row g-3">
        <!-- Attendance -->
        <div class="col-lg-4"><div class="card h-100"><div class="card-body">
            <h5 class="mb-3"><i class="bi bi-calendar-check me-2"></i>Attendance</h5>
            <div class="h2" th:classappend="${s.attendanceLow} ? 'text-danger' : 'text-success'"
                 th:text="${s.totalClasses > 0} ? ${s.attendancePercent} + '%' : 'NA'">80%</div>
            <div class="small text-danger mb-2" th:if="${s.attendanceLow}"><i class="bi bi-exclamation-triangle-fill me-1"></i>less than 75% </div>
            <form th:action="@{/teacher/students/{id}/attendance(id=${s.id})}" method="post" class="row g-2">
                <div class="col-6"><label class="form-label small">Attended</label>
                    <input class="form-control" type="number" min="0" name="attended" th:value="${s.attendedClasses}" required></div>
                <div class="col-6"><label class="form-label small">Total classes</label>
                    <input class="form-control" type="number" min="0" name="total" th:value="${s.totalClasses}" required></div>
                <div class="col-12"><button class="btn btn-primary w-100" type="submit">Update attendance</button></div>
            </form>
        </div></div></div>

        <!-- Fees -->
        <div class="col-lg-8"><div class="card h-100"><div class="card-body">
            <h5 class="mb-3"><i class="bi bi-cash-stack me-2"></i>Fees</h5>
            <div class="row text-center mb-3">
                <div class="col-4"><div class="small text-muted">Total</div><div class="fw-bold" th:text="'₹' + ${#numbers.formatDecimal(s.totalFees, 1, 'COMMA', 0, 'POINT')}"></div></div>
                <div class="col-4"><div class="small text-muted">Paid</div><div class="fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(s.paidFees, 1, 'COMMA', 0, 'POINT')}"></div></div>
                <div class="col-4"><div class="small text-muted">Pending</div><div class="fw-bold text-danger" th:text="'₹' + ${#numbers.formatDecimal(s.pendingFees, 1, 'COMMA', 0, 'POINT')}"></div></div>
            </div>
            <div class="row g-3">
                <div class="col-md-7">
                    <form th:action="@{/teacher/students/{id}/payment(id=${s.id})}" method="post" class="row g-2">
                        <div class="col-12 small fw-semibold">Payment record </div>
                        <div class="col-6"><input class="form-control" type="number" step="0.01" min="1" th:max="${s.pendingFees}" name="amount" placeholder="Amount" required></div>
                        <div class="col-6"><select class="form-select" name="mode"><option th:each="m : ${modes}" th:value="${m}" th:text="${m}"></option></select></div>
                        <div class="col-12"><input class="form-control" name="note" maxlength="190" placeholder="Note (optional)"></div>
                        <div class="col-12"><button class="btn btn-success w-100" type="submit" th:disabled="${s.pendingFees.signum() == 0}">Add Payment </button></div>
                    </form>
                </div>
                <div class="col-md-5">
                    <form th:action="@{/teacher/students/{id}/total-fees(id=${s.id})}" method="post" class="row g-2">
                        <div class="col-12 small fw-semibold">Change Total fees </div>
                        <div class="col-12"><input class="form-control" type="number" step="0.01" min="0" name="totalFees" th:value="${s.totalFees}" required></div>
                        <div class="col-12"><button class="btn btn-outline-primary w-100" type="submit">Update</button></div>
                    </form>
                </div>
            </div>
            <div class="table-responsive mt-3" th:if="${!#lists.isEmpty(payments)}">
                <table class="table table-sm mb-0">
                    <thead><tr><th>Date</th><th>Receipt</th><th>Mode</th><th class="text-end">Amount</th></tr></thead>
                    <tbody><tr th:each="p : ${payments}">
                        <td th:text="${#temporals.format(p.paidOn, 'dd MMM yyyy')}"></td>
                        <td th:text="${p.receiptNo}"></td><td th:text="${p.payMode}"></td>
                        <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(p.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                    </tr></tbody>
                </table>
            </div>
        </div></div></div>

        <!-- Marks -->
        <div class="col-12"><div class="card"><div class="card-body">
            <h5 class="mb-3"><i class="bi bi-award me-2"></i>Marks</h5>
            <form th:action="@{/teacher/students/{id}/marks(id=${s.id})}" method="post" class="row g-2 mb-3">
                <div class="col-12 col-md-3"><input class="form-control" name="subject" placeholder="Subject" required></div>
                <div class="col-12 col-md-3"><input class="form-control" name="examName" placeholder="Exam (Mid Sem...)" required></div>
                <div class="col-4 col-md-2"><input class="form-control" type="number" step="0.01" min="0" name="obtained" placeholder="Obtained" required></div>
                <div class="col-4 col-md-2"><input class="form-control" type="number" step="0.01" min="1" name="max" value="100" required></div>
                <div class="col-4 col-md-2"><button class="btn btn-primary w-100" type="submit">Add</button></div>
            </form>
            <div class="table-responsive">
                <table class="table table-sm mb-0">
                    <thead><tr><th>Subject</th><th>Exam</th><th>Marks</th><th>%</th><th>Grade</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="m : ${marks}">
                        <td th:text="${m.subject}"></td><td th:text="${m.examName}"></td>
                        <td th:text="${#numbers.formatDecimal(m.marksObtained, 1, 1)} + ' / ' + ${#numbers.formatDecimal(m.maxMarks, 1, 0)}"></td>
                        <td th:text="${m.percentage} + '%'"></td><td th:text="${m.grade}"></td>
                        <td class="text-end"><form th:action="@{/teacher/students/{id}/marks/{mid}/delete(id=${s.id},mid=${m.id})}" method="post" data-confirm="delete this marks ?">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(marks)}"><td colspan="6" class="text-center text-muted py-3">no marks yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div></div></div>
    </div>
</main>
</body>
</html>
