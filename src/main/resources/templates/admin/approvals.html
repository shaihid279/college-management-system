<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Approvals', ~{::main})}">
<body>
<main class="container">
    <h1 class="h3 mb-1">Approval Requests</h1>
    <p class="text-muted small">Teacher and Event Organizer registrations appear here.
        They can only log in after approval. Once an email is approved, it will not require approval again .</p>

    <div class="card" th:if="${#lists.isEmpty(pending)}"><div class="card-body coming-soon">
        <i class="bi bi-person-check"></i><h5 class="mt-2">There are no pending requests</h5></div></div>

    <div class="card mb-3" th:each="u : ${pending}"><div class="card-body">
        <div class="d-flex flex-wrap gap-3 align-items-center">
            <th:block th:replace="~{fragments/layout :: avatar(${u}, 56)}"></th:block>
            <div class="flex-grow-1">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <h5 class="mb-0" th:text="${u.fullName}">Name</h5>
                    <span class="badge text-bg-primary" th:text="${u.role}">ROLE</span>
                </div>
                <div class="small text-muted">
                    <span th:text="'@' + ${u.username}"></span> &middot;
                    <i class="bi bi-envelope"></i> <span th:text="${u.email}"></span>
                    <span th:if="${u.phone != null}"> &middot; <i class="bi bi-telephone"></i> <span th:text="${u.phone}"></span></span>
                </div>
                <div class="small text-muted" th:text="'Request: ' + ${#temporals.format(u.createdAt, 'dd MMM yyyy, hh:mm a')}"></div>
            </div>
            <div class="d-flex gap-2">
                <form th:action="@{/admin/approvals/{id}/approve(id=${u.id})}" method="post">
                    <button class="btn btn-success" type="submit"><i class="bi bi-check-lg me-1"></i>Approve</button></form>
                <form th:action="@{/admin/approvals/{id}/reject(id=${u.id})}" method="post" data-confirm="reject this request ?">
                    <button class="btn btn-outline-danger" type="submit"><i class="bi bi-x-lg me-1"></i>Reject</button></form>
            </div>
        </div>
    </div></div>

    <h5 class="mt-4 mb-2">Trusted emails (alredy approve)</h5>
    <div class="card"><div class="table-responsive">
        <table class="table table-sm mb-0">
            <thead><tr><th>Email</th><th>Role</th><th>Approved by</th><th>Date</th></tr></thead>
            <tbody>
            <tr th:each="a : ${trusted}">
                <td th:text="${a.email}"></td><td th:text="${a.role}"></td><td th:text="${a.approvedBy}"></td>
                <td th:text="${#temporals.format(a.approvedAt, 'dd MMM yyyy')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(trusted)}"><td colspan="4" class="text-center text-muted py-3">nobody right now.</td></tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
