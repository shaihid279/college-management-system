<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Feedback', ~{::main})}">
<body>
<main class="container">
    <h1 class="h3 mb-3">Student Feedback / Grievances</h1>
    <div class="card" th:if="${#lists.isEmpty(items)}"><div class="card-body coming-soon">
        <i class="bi bi-chat-dots"></i><h5 class="mt-2">No feedback has been received yet</h5></div></div>
    <div class="card mb-3" th:each="f : ${items}"><div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
            <div>
                <span class="badge me-1" th:classappend="${f.feedbackType == 'GRIEVANCE'} ? 'text-bg-warning' : 'text-bg-info'" th:text="${f.feedbackType}">TYPE</span>
                <strong th:text="${f.subject}">Subject</strong>
                <div class="small text-muted">
                    <span th:text="${f.student.user.fullName}"></span> (<span th:text="${f.student.idCardNo}"></span>, <span th:text="${f.student.branch}"></span>)
                    &middot; <span th:text="${#temporals.format(f.createdAt, 'dd MMM yyyy, hh:mm a')}"></span>
                </div>
            </div>
            <span class="badge" th:classappend="${f.status == 'RESOLVED'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${f.status}">OPEN</span>
        </div>
        <div class="mt-2" style="white-space: pre-line" th:text="${f.message}"></div>
        <form th:action="@{/admin/feedback/{id}/reply(id=${f.id})}" method="post" class="mt-3">
            <textarea class="form-control mb-2" name="reply" rows="2" maxlength="990" placeholder="Write a reply (the student will see it)" th:text="${f.reply}"></textarea>
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="resolved" value="true" th:id="'r' + ${f.id}" th:checked="${f.status == 'RESOLVED'}">
                    <label class="form-check-label" th:for="'r' + ${f.id}">Resolved mark</label>
                </div>
                <button class="btn btn-sm btn-primary" type="submit">Save</button>
            </div>
        </form>
    </div></div>
</main>
</body>
</html>
