<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Fee Structure', ~{::main})}">
<body>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h3 mb-0"><i class="bi bi-cash-stack text-success me-2"></i>Fee Structure</h1>
        <button th:if="${me != null and me.admin}" class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#addFee">
            <i class="bi bi-plus-lg me-1"></i>Fee add karein</button>
    </div>

    <div class="collapse mb-3" id="addFee" th:if="${me != null and me.admin}">
        <div class="card"><div class="card-body">
            <form th:action="@{/admin/fees}" method="post" class="row g-2">
                <div class="col-md-4"><select class="form-select" name="branch" required>
                    <option th:each="b : ${branches}" th:value="${b}" th:text="${b}"></option></select></div>
                <div class="col-6 col-md-2"><select class="form-select" name="year">
                    <option th:each="y : ${#numbers.sequence(1, 4)}" th:value="${y}" th:text="'Year ' + ${y}"></option></select></div>
                <div class="col-6 col-md-3"><input class="form-control" type="number" min="0" step="0.01" name="tuitionFee" placeholder="Tuition fee" required></div>
                <div class="col-6 col-md-3"><input class="form-control" type="number" min="0" step="0.01" name="otherFee" placeholder="Other fee" value="0"></div>
                <div class="col-md-9"><input class="form-control" name="notes" maxlength="190" placeholder="Notes (optional)"></div>
                <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Save</button></div>
            </form>
        </div></div>
    </div>

    <form th:action="@{/fees}" method="get" class="row g-2 mb-3">
        <div class="col-8 col-md-5"><select class="form-select" name="branch">
            <option value="">Sab branches</option>
            <option th:each="b : ${branches}" th:value="${b}" th:text="${b}" th:selected="${b == fBranch}"></option></select></div>
        <div class="col-4 col-md-2"><button class="btn btn-outline-primary w-100" type="submit">Filter</button></div>
    </form>

    <div class="card" th:if="${#lists.isEmpty(fees)}"><div class="card-body coming-soon">
        <i class="bi bi-cash-stack"></i><h5 class="mt-2">Fee structure coming soon</h5></div></div>

    <div class="card" th:if="${!#lists.isEmpty(fees)}"><div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>Branch</th><th>Year</th><th class="text-end">Tuition</th><th class="text-end">Other</th><th class="text-end">Total</th><th>Notes</th><th th:if="${me != null and me.admin}"></th></tr></thead>
            <tbody>
            <tr th:each="f : ${fees}">
                <td th:text="${f.branch}">Branch</td>
                <td th:text="${f.year}">1</td>
                <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(f.tuitionFee, 1, 'COMMA', 0, 'POINT')}"></td>
                <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(f.otherFee, 1, 'COMMA', 0, 'POINT')}"></td>
                <td class="text-end fw-bold" th:text="'₹' + ${#numbers.formatDecimal(f.total, 1, 'COMMA', 0, 'POINT')}"></td>
                <td class="small text-muted" th:text="${f.notes}"></td>
                <td th:if="${me != null and me.admin}">
                    <form th:action="@{/admin/fees/{id}/delete(id=${f.id})}" method="post" data-confirm="Delete karein?">
                        <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
