<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Timetable', ~{::main})}">
<body>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h3 mb-0"><i class="bi bi-clock text-primary me-2"></i>Class Timetable</h1>
        <button th:if="${me != null and me.admin}" class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#addTt">
            <i class="bi bi-plus-lg me-1"></i>Add lecture</button>
    </div>

    <div class="collapse mb-3" id="addTt" th:if="${me != null and me.admin}">
        <div class="card"><div class="card-body">
            <form th:action="@{/admin/timetable}" method="post" class="row g-2">
                <div class="col-md-5"><select class="form-select" name="branch" required>
                    <option th:each="b : ${branches}" th:value="${b}" th:text="${b}"></option></select></div>
                <div class="col-6 col-md-2"><select class="form-select" name="year">
                    <option th:each="y : ${#numbers.sequence(1, 4)}" th:value="${y}" th:text="'Year ' + ${y}"></option></select></div>
                <div class="col-6 col-md-2"><select class="form-select" name="day">
                    <option th:each="d : ${days}" th:value="${d}" th:text="${d}"></option></select></div>
                <div class="col-6 col-md-1"><input class="form-control px-1" type="time" name="startTime" required></div>
                <div class="col-6 col-md-2"><input class="form-control" type="time" name="endTime" required></div>
                <div class="col-md-4"><input class="form-control" name="subject" placeholder="Subject" required></div>
                <div class="col-md-3"><input class="form-control" name="teacherName" placeholder="Teacher"></div>
                <div class="col-md-3"><input class="form-control" name="room" placeholder="Room"></div>
                <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Save</button></div>
            </form>
        </div></div>
    </div>

    <form th:action="@{/timetable}" method="get" class="row g-2 mb-3">
        <div class="col-8 col-md-5"><select class="form-select" name="branch">
            <option value="">Sab branches</option>
            <option th:each="b : ${branches}" th:value="${b}" th:text="${b}" th:selected="${b == fBranch}"></option></select></div>
        <div class="col-4 col-md-2"><select class="form-select" name="year">
            <option value="">Sab years</option>
            <option th:each="y : ${#numbers.sequence(1, 4)}" th:value="${y}" th:text="'Year ' + ${y}" th:selected="${fYear != null and fYear == y}"></option></select></div>
        <div class="col-12 col-md-2"><button class="btn btn-outline-primary w-100" type="submit">Filter</button></div>
    </form>

    <div class="card" th:if="${#maps.isEmpty(byDay)}"><div class="card-body coming-soon">
        <i class="bi bi-clock"></i><h5 class="mt-2">Timetable coming soon</h5>
        <p class="text-muted mb-0">The timetable will appear here once it is added.
            .</p></div></div>

    <div class="row g-3">
        <div class="col-md-6" th:each="entry : ${byDay}">
            <div class="card h-100">
                <div class="card-header bg-primary text-white fw-semibold" style="border-radius: 1rem 1rem 0 0" th:text="${entry.key}">Monday</div>
                <div>
                    <div class="list-row" th:each="t : ${entry.value}">
                        <div class="text-nowrap small fw-semibold text-primary" style="min-width: 110px">
                            <span th:text="${#temporals.format(t.startTime, 'hh:mm a')}"></span><br>
                            <span class="text-muted fw-normal" th:text="${#temporals.format(t.endTime, 'hh:mm a')}"></span>
                        </div>
                        <div class="flex-grow-1">
                            <div class="fw-semibold" th:text="${t.subject}">Subject</div>
                            <div class="small text-muted">
                                <span th:if="${t.teacherName != null and !t.teacherName.isBlank()}" th:text="${t.teacherName}"></span>
                                <span th:if="${t.room != null and !t.room.isBlank()}" th:text="' | Room ' + ${t.room}"></span>
                            </div>
                        </div>
                        <form th:if="${me != null and me.admin}" th:action="@{/admin/timetable/{id}/delete(id=${t.id})}" method="post" data-confirm="delete entry?">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
