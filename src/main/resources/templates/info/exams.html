<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Exam Schedule', ~{::main})}">
<body>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h3 mb-0"><i class="bi bi-journal-check text-primary me-2"></i>Exam Schedule</h1>
        <button th:if="${me != null and me.admin}" class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#addExam">
            <i class="bi bi-plus-lg me-1"></i>Exam add karein</button>
    </div>

    <div class="collapse mb-3" id="addExam" th:if="${me != null and me.admin}">
        <div class="card"><div class="card-body">
            <form th:action="@{/admin/exams}" method="post" class="row g-2">
                <div class="col-md-4"><input class="form-control" name="subject" placeholder="Subject" required></div>
                <div class="col-md-4"><select class="form-select" name="branch" required>
                    <option th:each="b : ${branches}" th:value="${b}" th:text="${b}"></option></select></div>
                <div class="col-6 col-md-2"><select class="form-select" name="year">
                    <option th:each="y : ${#numbers.sequence(1, 4)}" th:value="${y}" th:text="'Year ' + ${y}"></option></select></div>
                <div class="col-6 col-md-2"><input class="form-control" name="examType" placeholder="Mid Sem / End Sem"></div>
                <div class="col-6 col-md-3"><input class="form-control" type="date" name="examDate" required></div>
                <div class="col-6 col-md-3"><input class="form-control" type="time" name="startTime"></div>
                <div class="col-md-3"><input class="form-control" name="room" placeholder="Room / Hall"></div>
                <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Save</button></div>
            </form>
        </div></div>
    </div>

    <form th:action="@{/exams}" method="get" class="row g-2 mb-3">
        <div class="col-8 col-md-5"><select class="form-select" name="branch">
            <option value="">Sab branches</option>
            <option th:each="b : ${branches}" th:value="${b}" th:text="${b}" th:selected="${b == fBranch}"></option></select></div>
        <div class="col-4 col-md-2"><select class="form-select" name="year">
            <option value="">Sab years</option>
            <option th:each="y : ${#numbers.sequence(1, 4)}" th:value="${y}" th:text="'Year ' + ${y}" th:selected="${fYear != null and fYear == y}"></option></select></div>
        <div class="col-12 col-md-2"><button class="btn btn-outline-primary w-100" type="submit">Filter</button></div>
    </form>

    <div class="card" th:if="${#lists.isEmpty(exams)}"><div class="card-body coming-soon">
        <i class="bi bi-journal-check"></i><h5 class="mt-2">Exam schedule coming soon</h5>
        <p class="text-muted mb-0">Date aate hi yahan dikh jayegi.</p></div></div>

    <div class="card" th:if="${!#lists.isEmpty(exams)}"><div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>Date</th><th>Subject</th><th>Branch / Year</th><th>Type</th><th>Time</th><th>Room</th><th th:if="${me != null and me.admin}"></th></tr></thead>
            <tbody>
            <tr th:each="x : ${exams}">
                <td class="text-nowrap fw-semibold" th:text="${#temporals.format(x.examDate, 'dd MMM yyyy')}">date</td>
                <td th:text="${x.subject}">Subject</td>
                <td><span th:text="${x.branch}"></span> <span class="badge text-bg-secondary" th:text="'Y' + ${x.year}"></span></td>
                <td th:text="${x.examType}"></td>
                <td class="text-nowrap" th:text="${x.startTime != null} ? ${#temporals.format(x.startTime, 'hh:mm a')} : '-'"></td>
                <td th:text="${x.room}"></td>
                <td th:if="${me != null and me.admin}">
                    <form th:action="@{/admin/exams/{id}/delete(id=${x.id})}" method="post" data-confirm="Exam delete karein?">
                        <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
