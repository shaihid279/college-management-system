<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Events', ~{::main})}">
<body>
<main class="container">
    <h1 class="h3 mb-3"><i class="bi bi-calendar-event text-primary me-2"></i>College Events</h1>

    <div class="card" th:if="${#lists.isEmpty(events)}"><div class="card-body coming-soon">
        <i class="bi bi-calendar-event"></i><h5 class="mt-2">Abhi koi event nahi hai</h5>
        <p class="text-muted mb-0">Aapke department ke events yahin dikhenge.</p></div></div>

    <h5 class="mb-3" th:if="${!#lists.isEmpty(events)}">Aane wale events</h5>
    <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4" th:each="e : ${events}" th:if="${!e.eventDateTime.isBefore(now)}">
            <div class="card h-100 card-hover">
                <img th:if="${e.banner != null}" th:src="@{'/uploads/' + ${e.banner}}" class="event-banner" alt="">
                <div th:unless="${e.banner != null}" class="event-banner-ph"><i class="bi bi-calendar-event"></i></div>
                <div class="card-body d-flex flex-column">
                    <div class="d-flex gap-3 mb-2">
                        <div class="date-badge">
                            <div class="d" th:text="${#temporals.format(e.eventDateTime, 'dd')}">01</div>
                            <div class="m" th:text="${#temporals.format(e.eventDateTime, 'MMM')}">Jan</div>
                        </div>
                        <div>
                            <h5 class="mb-1" th:text="${e.title}">Title</h5>
                            <div class="small text-muted"><i class="bi bi-clock me-1"></i><span th:text="${#temporals.format(e.eventDateTime, 'hh:mm a')}"></span></div>
                            <div class="small text-muted" th:if="${e.venue != null and !e.venue.isBlank()}"><i class="bi bi-geo-alt me-1"></i><span th:text="${e.venue}"></span></div>
                        </div>
                    </div>
                    <div class="mb-2">
                        <span class="badge text-bg-success" th:if="${e.forAll}">All Departments</span>
                        <span class="badge text-bg-info me-1" th:each="t : ${e.targetList}" th:text="${t}">Dept</span>
                    </div>
                    <p class="small" th:text="${e.description}" style="white-space: pre-line"></p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="badge text-bg-light border"><i class="bi bi-people me-1"></i><span th:text="${counts[e.id]}">0</span> registered</span>
                        <th:block th:if="${me.student}">
                            <form th:if="${registered.contains(e.id)}" th:action="@{/student/events/{id}/unregister(id=${e.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Cancel</button></form>
                            <form th:unless="${registered.contains(e.id)}" th:action="@{/student/events/{id}/register(id=${e.id})}" method="post">
                                <button class="btn btn-sm btn-primary" type="submit">Register</button></form>
                        </th:block>
                    </div>
                    <div class="small text-success mt-2" th:if="${me.student and registered.contains(e.id)}"><i class="bi bi-check-circle-fill me-1"></i>Aap registered hain</div>
                </div>
            </div>
        </div>
    </div>

    <h5 class="mb-3 text-muted" th:if="${!#lists.isEmpty(events)}">Ho chuke events</h5>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="e : ${events}" th:if="${e.eventDateTime.isBefore(now)}">
            <div class="card h-100 opacity-75"><div class="card-body d-flex gap-3">
                <div class="date-badge" style="background: #6c757d">
                    <div class="d" th:text="${#temporals.format(e.eventDateTime, 'dd')}">01</div>
                    <div class="m" th:text="${#temporals.format(e.eventDateTime, 'MMM')}">Jan</div>
                </div>
                <div><h6 class="mb-1" th:text="${e.title}">Title</h6>
                    <span class="badge text-bg-secondary">Ho chuka</span></div>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
