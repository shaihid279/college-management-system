<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Contact Us', ~{::main})}">
<body>
<main class="container">
    <div class="text-center mb-4">
        <h1 class="h2">Contact Us</h1>
        <p class="text-muted">Koi sawal ya suggestion? Hume likhiye, hum jaldi reply karenge.</p>
    </div>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card mb-3"><div class="card-body d-flex gap-3">
                <div class="stat-icon bg-grad-1"><i class="bi bi-geo-alt"></i></div>
                <div><h6 class="mb-0">Address</h6><span class="text-muted small">dr. vithhalrao vikhe patil college of engineering,</span></div>
            </div></div>
            <div class="card mb-3"><div class="card-body d-flex gap-3">
                <div class="stat-icon bg-grad-2"><i class="bi bi-telephone"></i></div>
                <div><h6 class="mb-0">Phone</h6><span class="text-muted small">9970622512</span></div>
            </div></div>
            <div class="card mb-3"><div class="card-body d-flex gap-3">
                <div class="stat-icon bg-grad-3"><i class="bi bi-envelope"></i></div>
                <div><h6 class="mb-0">Email</h6><span class="text-muted small">s.8668shaikh@gmail.com</span></div>
            </div></div>
            <div class="card"><div class="card-body d-flex gap-3">
                <div class="stat-icon bg-grad-4"><i class="bi bi-clock"></i></div>
                <div><h6 class="mb-0">Office Hours</h6><span class="text-muted small">Mon - Sat, 10:00 AM - 5:00 PM</span></div>
            </div></div>
        </div>
        <div class="col-lg-7">
            <div class="card"><div class="card-body p-4">
                <form th:action="@{/contact}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Aapka naam</label>
                            <input class="form-control" name="name" maxlength="100" required></div>
                        <div class="col-md-6"><label class="form-label">Email</label>
                            <input class="form-control" type="email" name="email" maxlength="120" required></div>
                        <div class="col-12"><label class="form-label">Subject</label>
                            <input class="form-control" name="subject" maxlength="190"></div>
                        <div class="col-12"><label class="form-label">Message</label>
                            <textarea class="form-control" name="message" rows="5" minlength="10" maxlength="2000" required></textarea></div>
                        <div class="d-none" aria-hidden="true">
                            <input name="website" tabindex="-1" autocomplete="off">
                        </div>
                        <div class="col-12"><button class="btn btn-primary px-4" type="submit"><i class="bi bi-send me-1"></i>Message bhejein</button></div>
                    </div>
                </form>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
